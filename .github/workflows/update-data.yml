name: Update data

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run catalogue tests
        run: python -m unittest discover -s tests -v

      - name: Generate dataset
        run: python scripts/update_data.py

      - name: Validate dataset
        run: python scripts/validate_data.py

      - name: Generate consumer artefacts
        run: python scripts/export_consumers.py

      - name: Check recent BOC changes
        run: python scripts/check_boc.py
        continue-on-error: true

      - name: Upload BOC review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: boc-centres-watch
          path: |
            dist/boc-watch.json
            dist/boc-watch.md
          if-no-files-found: ignore
          retention-days: 30

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-centres
          delete-branch: true
          commit-message: "Actualizar catálogo de centros"
          title: "Actualizar catálogo de centros"
          body: |
            ## Resumen

            Actualización automática generada a partir de las fuentes públicas
            actuales del Gobierno de Canarias y de las correcciones revisadas
            y versionadas del repositorio.

            ## Validación

            - `python -m unittest discover -s tests -v`
            - `python scripts/update_data.py`
            - `python scripts/validate_data.py`
            - `python scripts/export_consumers.py`
            - `python scripts/check_boc.py`

            El informe del BOC es únicamente un detector de posibles desfases:
            nunca modifica el catálogo automáticamente. Las altas, bajas o
            transformaciones adelantadas a OpenData deben incorporarse como
            datos curados con una fuente pública explícita.

            Este PR debe revisarse antes de fusionarse.
          labels: data,automated
