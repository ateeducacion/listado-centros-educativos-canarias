name: Directory watch

on:
  schedule:
    - cron: "17 4 * * 0"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: directory-watch
  cancel-in-progress: true

jobs:
  compare:
    name: Compare operational directory
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compare every known centre code
        run: python scripts/directory_diff.py --scope all --workers 4 --timeout 20
        continue-on-error: true

      - name: Upload directory report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: directory-diff
          path: |
            dist/directory-diff.json
            dist/directory-diff.md
          if-no-files-found: error
          retention-days: 30
