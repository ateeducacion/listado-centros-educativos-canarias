name: Refresh catalogue

on:
  push:
    branches:
      - main
    paths:
      - "data/**"
      - "scripts/update_data.py"
      - "scripts/catalogue_change_report.py"
      - "scripts/validate_data.py"
      - "scripts/export_consumers.py"
      - "scripts/check_boc.py"
      - "requirements.txt"
      - ".github/workflows/refresh-catalogue.yml"
  schedule:
    - cron: "37 3 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-catalogue
  cancel-in-progress: true

jobs:
  generate:
    name: Generate and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Generate catalogue
        run: python scripts/update_data.py

      - name: Validate catalogue
        run: python scripts/validate_data.py

      - name: Generate consumer artefacts
        run: python scripts/export_consumers.py

      - name: Check recent BOC changes
        run: python scripts/check_boc.py
        continue-on-error: true

      - name: Upload generated catalogue
        uses: actions/upload-artifact@v7
        with:
          name: catalogue-refresh
          path: |
            centros.csv
            centros.json
            dist/boc-watch.json
            dist/boc-watch.md
            data/boc-pendiente.md
          if-no-files-found: error
          retention-days: 7

  propose:
    name: Open data pull request
    needs: generate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Drop stale BOC report
        run: rm -f data/boc-pendiente.md

      - name: Download generated catalogue
        uses: actions/download-artifact@v8
        with:
          name: catalogue-refresh
          path: .

      - name: Generate PR change report
        run: |
          git show HEAD:centros.csv > "$RUNNER_TEMP/centros-before.csv"
          python scripts/catalogue_change_report.py \
            --before "$RUNNER_TEMP/centros-before.csv" \
            --after centros.csv \
            --output "$RUNNER_TEMP/catalogue-pr.md"

      - name: Create update pull request
        uses: peter-evans/create-pull-request@v8
        with:
          branch: automation/update-centres
          delete-branch: true
          commit-message: "Actualizar catálogo de centros"
          title: "Actualizar catálogo de centros"
          body-path: ${{ runner.temp }}/catalogue-pr.md
          labels: data,automated
